// Migration04 §09: :bliss-prefs — see Plans/Migration04/09-build-and-rollout.md §2.3
plugins {
    alias libs.plugins.android.library
    alias libs.plugins.kotlin
}

android {
    namespace 'foundation.e.bliss.preferences'
    compileSdk 36

    defaultConfig {
        minSdk 35
    }

    sourceSets {
        named("main") {
            java.srcDirs("src/main/kotlin")
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    kotlinOptions {
        jvmTarget = "21"
    }
}

dependencies {
    implementation libs.androidx.preference
}
