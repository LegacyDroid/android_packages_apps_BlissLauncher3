// Migration04 §09: settings.gradle — see Plans/Migration04/09-build-and-rollout.md §2.2
pluginManagement {
    includeBuild("build-logic")

    repositories {
        google()
        gradlePluginPortal()
        mavenCentral()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    repositories {
        google()
        mavenCentral()
        maven { url = "https://gitlab.e.foundation/api/v4/groups/9/-/packages/maven" }
    }
}

include ':animationlib'
project(':animationlib').projectDir = new File("$rootDir/libs_systemui", 'animationlib')

include ':IconLoader'
project(':IconLoader').projectDir = new File("$rootDir/libs_systemui", 'iconloaderlib')

include ':msdllib'
project(':msdllib').projectDir = new File("$rootDir/libs_systemui", 'msdllib')

include ':contextualeducationlib'
project(':contextualeducationlib').projectDir = new File("$rootDir/libs_systemui", 'contextualeducationlib')

// Migration04 §09 — leaf-only Bliss modules (Plans/Migration04/09-build-and-rollout.md §2.1)
include ':bliss-compat'
project(':bliss-compat').projectDir = new File(rootDir, 'bliss-compat')

include ':bliss-prefs'
project(':bliss-prefs').projectDir = new File(rootDir, 'bliss-prefs')

/*
 * Bliss touchpoint(s) (Migration05):
 *   - include ':lint-rules' — pure-JVM module hosting custom Android Lint
 *     detectors (ReflectionGateOnlyDetector, PrefXmlKeyRegistryDetector).
 *     Wired into the root project via `lintChecks project(':lint-rules')`.
 *     — Plan ref: Plans/Migration05/03-custom-lint-rules.md §6
 *
 * The body of this file otherwise tracks the Migration04 §09 module list.
 */
include ':lint-rules'
project(':lint-rules').projectDir = new File(rootDir, 'lint-rules')

rootProject.name = "BlissLauncher3"
