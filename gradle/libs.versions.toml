[versions]
agp = "8.9.1"
dagger = "2.56.1"
## Freeze at 2.1.10 for a15
kotlin = "2.1.10"
ksp = "2.1.10-1.0.31"
org-jetbrains-kotlin-jvm = "2.1.10"
window = "1.3.0"
core-animation = "1.0.0"
androidx-core = "1.15.0"
androidx-appcompat = "1.7.0"
androidx-dynamicanimation = "1.0.0"
androidx-recyclerview = "1.4.0"
androidx-preference = "1.2.1"
androidx-slice-view = "1.0.0"
airbnb-lottie = "6.6.4"
e-telemetry = "0.0.10-alpha"
timber = "5.0.1"
elib = "0.0.1-alpha11"
google-material = "1.12.0"
google-protobuf = "0.9.4"
google-protobuf-javalite = "4.30.2"
hoko-blur = "1.5.3"
reactivex-rxkotlin3 = "3.0.1"
spotless = "6.25.0"
spotless-plugin = "1.0"
githooks-plugin = "1.0"
square-retrofit = "2.11.0"
square-okhttp = "4.12.0"
square-gson = "2.11.0"
square-logging = "4.12.0"

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
google-protobuf = { id = "com.google.protobuf", version.ref = "google-protobuf" }
org-jetbrains-kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "org-jetbrains-kotlin-jvm" }
bliss-spotless = { id = "foundation.e.bliss.spotless", version.ref = "spotless-plugin" }
bliss-githooks = { id = "foundation.e.bliss.githooks", version.ref = "githooks-plugin" }

[libraries]
androidx-core = { module = "androidx.core:core-ktx", version.ref = "androidx-core" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "androidx-appcompat" }
androidx-dynamicanimation = { module = "androidx.dynamicanimation:dynamicanimation", version.ref = "androidx-dynamicanimation" }
androidx-recyclerview = { module = "androidx.recyclerview:recyclerview", version.ref = "androidx-recyclerview" }
androidx-preference = { module = "androidx.preference:preference-ktx", version.ref = "androidx-preference" }
androidx-slice-view = { module = "androidx.slice:slice-view", version.ref = "androidx-slice-view" }
androidx-window = { module = "androidx.window:window", version.ref = "window" }
androidx-core-animation = { module = "androidx.core:core-animation", version.ref = "core-animation" }

airbnb-lottie = { module = "com.airbnb.android:lottie", version.ref = "airbnb-lottie" }
dagger = { module = "com.google.dagger:dagger", version.ref = "dagger" }
dagger-compiler = { module = "com.google.dagger:dagger-compiler", version.ref = "dagger" }
build-spotless = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless" }
e-telemetry = { module = "foundation.e.lib:telemetry", version.ref = "e-telemetry" }
timber = { module = "com.jakewharton.timber:timber", version.ref = "timber" }
elib = { module = "foundation.e:elib", version.ref = "elib" }
google-material = { module = "com.google.android.material:material", version.ref = "google-material" }
google-protobuf-javalite = { module = "com.google.protobuf:protobuf-javalite", version.ref = "google-protobuf-javalite" }
hoko-blur = { module = "io.github.hokofly:hoko-blur", version.ref = "hoko-blur" }
reactivex-rxkotlin3 = { module = "io.reactivex.rxjava3:rxkotlin", version.ref = "reactivex-rxkotlin3" }

square-retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "square-retrofit" }
square-okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "square-okhttp" }
square-gson = { module = "com.squareup.retrofit2:converter-gson", version.ref = "square-gson" }
square-logging = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "square-logging" }
