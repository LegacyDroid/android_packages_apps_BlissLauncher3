image: "registry.gitlab.e.foundation/e/os/docker-android-apps-cicd:latest"

variables:
  APK_PATH: "build/outputs/apk/blissWithQuickstep/release"
  UNSIGNED_APK: "BlissLauncher-a15-release.apk"
  COMMUNITY_APK: "BlissLauncher-a15-community.apk"
  OFFICIAL_APK: "BlissLauncher-a15-official.apk"
  TEST_APK: "BlissLauncher-a15-test.apk"

stages:
  - auto-merge-main
  - build
  - gitlab_release

include:
  - project: 'e/templates'
    ref: master
    file: '/gitlab-ci/.gitlab-ci-auto-merge-main.yml'

before_script:
  - export JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64
  - export GRADLE_USER_HOME=$(pwd)/.gradle
  - chmod +x ./gradlew
  # Submodule fetch via the runner's CI_JOB_TOKEN-injected Authorization header
  # intermittently triggers a 30X redirect from the fork URL to the upstream
  # source repo (which doesn't carry the WIP submodule commit). Retry a few
  # times; if the auth-injected attempts keep redirecting, fall back to an
  # explicit anonymous clone of the fork at the registered submodule SHA.
  - |
    SUBMOD_SHA=$(git ls-tree HEAD libs_systemui | awk '{print $3}')
    SUBMOD_URL=$(git config -f .gitmodules submodule.libs_systemui.url)
    if [[ "$SUBMOD_URL" == ../* ]]; then
      PARENT_DIR=$(dirname "$(git config --get remote.origin.url)")
      SUBMOD_URL="${PARENT_DIR}/${SUBMOD_URL#../}"
    fi
    for i in 1 2 3; do
      git -c http.extraheader= submodule update --init --recursive && break
      echo "[submodule] attempt $i failed; sleeping 10s..."
      sleep 10
    done
    if [ ! -d libs_systemui/.git ] || [ -z "$(ls -A libs_systemui 2>/dev/null)" ]; then
      echo "[submodule] auth-injected attempts kept redirecting; falling back to explicit anonymous clone of $SUBMOD_URL @ $SUBMOD_SHA"
      rm -rf libs_systemui
      git -c http.extraheader= clone "$SUBMOD_URL" libs_systemui
      (cd libs_systemui && git -c http.extraheader= fetch --depth=20 origin "$SUBMOD_SHA" && git checkout "$SUBMOD_SHA")
    fi

cache:
  key: ${CI_PROJECT_ID}
  paths:
    - .gradle/

blissWithQuickstepDebug:
  stage: build
  script:
    - ./gradlew assembleblissWithQuickstepDebug
  artifacts:
    paths:
      - build/outputs/apk

blissWithQuickstepRelease:
  stage: build
  script:
    - ./gradlew assembleblissWithQuickstepRelease
  artifacts:
    paths:
      - build/outputs/apk

spotlessCheck:
  stage: build
  rules:
    - if: '$CI_PROJECT_PATH == "Siavash/BlissLauncher3"'
  interruptible: true
  script:
    - ./gradlew spotlessCheck

# Audit01 #07 — fail CI if lint-baseline.xml grows beyond the recorded cap.
# See hooks/check-lint-baseline-cap.sh and Plans/Audits/audit01/07-lint-baseline-drainage.md.
lint-baseline-cap:
  stage: build
  rules:
    - if: '$CI_PROJECT_PATH == "Siavash/BlissLauncher3"'
  interruptible: true
  script:
    - chmod +x ./hooks/check-lint-baseline-cap.sh
    - ./hooks/check-lint-baseline-cap.sh

lintblissWithQuickstepDebug:
  stage: build
  rules:
    - if: '$CI_PROJECT_PATH == "Siavash/BlissLauncher3"'
  interruptible: true
  script:
    - ./gradlew lintblissWithQuickstepDebug
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - "**/build/reports/lint-results-*.html"
      - "**/build/reports/lint-results-*.xml"

testblissWithQuickstepDebugUnitTest:
  stage: build
  rules:
    - if: '$CI_PROJECT_PATH == "Siavash/BlissLauncher3"'
  interruptible: true
  script:
    - ./gradlew testblissWithQuickstepDebugUnitTest
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit: "**/build/test-results/testblissWithQuickstepDebugUnitTest/TEST-*.xml"
    paths:
      - "**/build/reports/tests/"

init_submodules:
  stage: gitlab_release
  rules:
    - if: '$CI_COMMIT_TAG && $CI_COMMIT_REF_PROTECTED == "true"'
      when: on_success
  script:
    - git clone https://gitlab.e.foundation/e/os/system-apps-update-info.git systemAppsUpdateInfo
  artifacts:
    paths:
      - systemAppsUpdateInfo/scripts/

generate-apks:
  stage: gitlab_release
  rules:
    - if: '$CI_COMMIT_TAG && $CI_COMMIT_REF_PROTECTED == "true"' 
      when: on_success
  needs:
    - init_submodules
    - blissWithQuickstepRelease
  dependencies:
    - init_submodules
    - blissWithQuickstepRelease
  script:
    - |
      ./systemAppsUpdateInfo/scripts/generate-apks.sh \
      "$APK_PATH" "$UNSIGNED_APK" "$COMMUNITY_APK" "$OFFICIAL_APK" "$TEST_APK"
  artifacts:
    paths:
      - $APK_PATH/$UNSIGNED_APK
      - $APK_PATH/$COMMUNITY_APK
      - $APK_PATH/$OFFICIAL_APK
      - $APK_PATH/$TEST_APK

create-json-files:
  stage: gitlab_release
  dependencies:
    - init_submodules
    - generate-apks
  needs:
    - init_submodules
    - generate-apks
  rules:
    - if: '$CI_COMMIT_TAG && $CI_COMMIT_REF_PROTECTED == "true"'
      when: on_success
  script:
    - |
      ./systemAppsUpdateInfo/scripts/create-json-files.sh \
      "$APK_PATH" "$UNSIGNED_APK" "$COMMUNITY_APK" "$OFFICIAL_APK" "$TEST_APK"
  artifacts:
    paths:
      - community.json
      - official.json
      - test.json

create-test-release:
  stage: gitlab_release
  dependencies:
    - init_submodules
  needs:
    - init_submodules
    - create-json-files
    - generate-apks
  rules:
    - if: '$CI_COMMIT_TAG && $CI_COMMIT_REF_PROTECTED == "true"'
      when: manual
  script:
    - |
      ./systemAppsUpdateInfo/scripts/create-test-release.sh \
      "$APK_PATH" "$TEST_APK"
  allow_failure: true


create-release:
  stage: gitlab_release
  dependencies:
    - init_submodules
  needs:
    - init_submodules
    - create-json-files
    - generate-apks
  rules:
    - if: '$CI_COMMIT_TAG && $CI_COMMIT_REF_PROTECTED == "true"'
      when: manual
  script:
    - |
      ./systemAppsUpdateInfo/scripts/create-release.sh \
      "$APK_PATH" "$UNSIGNED_APK" "$COMMUNITY_APK" "$OFFICIAL_APK"
  allow_failure: true
