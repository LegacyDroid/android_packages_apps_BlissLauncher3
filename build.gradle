    api libs.airbnb.lottie

    implementation libs.androidx.core
    implementation libs.androidx.core.animation
    implementation libs.androidx.graphics.shapes
    implementation libs.androidx.preference
    implementation libs.androidx.room.runtime
    implementation libs.androidx.room.ktx
    ksp libs.androidx.room.compiler
    implementation libs.androidx.slice.view
    implementation libs.androidx.window
    implementation libs.blur
    implementation libs.dagger
    implementation libs.elib
    implementation libs.google.protobuf.javalite
    implementation libs.google.material
    implementation libs.kotlinx.coroutines.core
    implementation libs.kotlinx.coroutines.rx2
    implementation libs.kotlinx.serialization.json
    implementation libs.logging.interceptor
    implementation libs.okhttp
    implementation libs.telemetry
    implementation libs.timber

    ksp libs.dagger.compiler

    implementation project(':animationlib')
    implementation project(':IconLoader')
    implementation project(':msdllib')
    implementation project(':contextualeducationlib')

    // Migration04 §09 — leaf-only Bliss modules. See
    // Plans/Migration04/09-build-and-rollout.md §2.5. Both modules expose pure
    // Kotlin/Java with no Dagger graph wiring, so wiring them as plain
    // implementation deps is sufficient.
    implementation project(':bliss-compat')
    implementation project(':bliss-prefs')
    implementation project(':bliss-core-contracts')
    implementation project(':bliss-folders-data')
    implementation project(':bliss-backup-parser')
    implementation project(':bliss-search-providers')
    implementation project(':bliss-policy-core')
    implementation project(':bliss-animation-safety')
    implementation project(':bliss-widgets-data')

    // Migration05 §F3 — Custom Android Lint detectors. The :lint-rules
    // module ships ReflectionGateOnlyDetector and PrefXmlKeyRegistryDetector;
    // both default to Severity.WARNING, promotion to ERROR deferred to a
    // follow-up migration once a clean run is verified.
    // See Plans/Migration05/03-custom-lint-rules.md §6.
    lintChecks project(':lint-rules')

    implementation fileTree(dir: "libs", include: [
            'Launcher3QuickStepLib.jar',
            'com_android_launcher3_flags_lib.jar',
            'android.os.flags-aconfig-java.jar',
            'com.android.window.flags.window-aconfig-java.jar'
    ])

    // Migration04 §08 — JVM unit-test deps. JUnit4 stays the test runner
    // (Migration04 is structural; no test-framework migration). Robolectric is
    // pulled in for any test that needs a Context; pure-JVM tests can ignore it.
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
    testImplementation 'androidx.test.ext:junit:1.2.1'
    // Migration04 §05 — Mockito for the policy unit tests that need cheap
    // stand-ins for AOSP types (CellLayout, ReorderParameters) without
    // standing up Robolectric.
    testImplementation 'org.mockito:mockito-core:5.12.0'
    // Audit01 #02 — Room MigrationTestHelper for DrawerFolderDatabase schema
    // pin tests. Version pinned to libs.versions.toml androidx-room (2.7.0)
    // by hand; if that version bumps, bump this string too. See
    // Plans/Audits/audit01/02-room-destructive-migration.md.
    testImplementation 'androidx.room:room-testing:2.7.0'
}

// Migration04 §08 — re-generate the committed synthetic .lawnchairbackup
// fixture by running the SyntheticBackupBuilder.main entrypoint. Wiring this
// as a Gradle task means the fixture is reproducible without a developer
// hand-running kotlinc -script. Manual invocation:
//   ./gradlew buildSyntheticBackup
// Defer wiring until after AGP has registered the variant test tasks; only
// at afterEvaluate does the per-variant test classpath exist on the Test
// task. We pull it from there so that kotlin-stdlib (and any other test
// dependency) reaches the JavaExec invocation without re-resolving the
// AGP-internal variant configuration directly (which fails ambiguously
// because it carries product-flavor attributes the root project doesn't).
afterEvaluate {
    def testTask = tasks.findByName('testBlissWithQuickstepDebugUnitTest')
    if (testTask != null) {
        tasks.register('buildSyntheticBackup', JavaExec) {
            group = 'verification'
            description = 'Regenerate bliss/test/resources/fixtures/synthetic.lawnchairbackup'
            dependsOn 'compileBlissWithQuickstepDebugUnitTestKotlin'
            classpath = testTask.classpath
            mainClass = 'foundation.e.bliss.backup.fixtures.SyntheticBackupBuilder'
            args 'bliss/test/resources/fixtures'
        }
    }
}

protobuf {
    protoc {
        artifact = "com.google.protobuf:protoc:4.33.0"
    }
    generateProtoTasks {
        all().each { task ->
            task.builtins {
                remove java
                java { option "lite" }
            }
        }
    }
}
