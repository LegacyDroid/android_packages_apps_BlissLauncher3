import org.jetbrains.kotlin.gradle.tasks.KotlinCompile

/*
 * Bliss touchpoint(s):
 *   - Migration04 §08 — JVM unit-test source-set + buildSyntheticBackup
 *     task; — Plan ref Plans/Migration04/08-observability-and-testing.md §3
 *   - Migration04 §09 — module split (`:bliss-compat`, `:bliss-prefs`),
 *     `lint { baseline ... disable "UElementAsPsi" }` block, R8 keeps;
 *     — Plan ref Plans/Migration04/09-build-and-rollout.md §2-§3
 *   - Migration05 §F1   — disable "UElementAsPsi" UAST detector to stop
 *     Lint crashing inside KaFirExpressionTypeProvider;
 *     — Plan ref Plans/Migration05/01-lint-and-logger.md §F1
 *   - Migration05 §F1.5 — `baseline = file("lint-baseline.xml")` to absorb
 *     ~2102 latent errors surfaced after F1; baseline owned by F1.5;
 *     — Plan ref Plans/Migration05/01-lint-and-logger.md §F1.5
 *   - Migration05 §F3   — `lintChecks project(':lint-rules')` wires the two
 *     custom detectors into every lint run;
 *     — Plan ref Plans/Migration05/03-custom-lint-rules.md §6
 *
 * The body of this file otherwise tracks AOSP Launcher3's build.gradle.
 */
plugins {
    alias libs.plugins.android.application
    alias libs.plugins.android.library apply false
    alias libs.plugins.kotlin
    alias libs.plugins.google.protobuf
    alias libs.plugins.ksp
    alias libs.plugins.bliss.spotless
    alias libs.plugins.bliss.githooks
    alias libs.plugins.kotlin.serialization
}

subprojects {
    afterEvaluate {
        if (extensions.findByName("android") != null) {
            android {
                defaultConfig {
                    if (minSdk > 35) minSdk = 35
                }
            }
        }
    }
}

allprojects {
    var FRAMEWORK_PREBUILTS_DIR = "$rootDir/libs/"
    ext.addFrameworkJar = { String name ->
        def frameworkJar = new File(FRAMEWORK_PREBUILTS_DIR, name)
        if (frameworkJar.exists()) {
            gradle.projectsEvaluated {
                tasks.withType(JavaCompile).configureEach {
                    classpath = files(frameworkJar, classpath)
                }
                tasks.withType(KotlinCompile).configureEach {
                    libraries.from(files(frameworkJar))
                }
            }

            dependencies {
                compileOnly files(frameworkJar)
                compileOnly fileTree(dir: FRAMEWORK_PREBUILTS_DIR, include: 'Launcher3QuickStepLib')
            }
        }
    }
}

var appVersionCode = 3010020
var appVersion = "3.1.2"

def versionPropsFile = file('local.properties')
Properties versionProps = new Properties()

if (versionPropsFile.exists()) {
    versionProps.load(new FileInputStream(versionPropsFile))
}

if (!versionProps.containsKey('VERSION_CODE')) {
    versionProps['VERSION_CODE'] = appVersionCode.toString()
    versionProps.store(versionPropsFile.newWriter(), null)
}

def getVersionCode = { ->
    if (versionPropsFile.canRead()) {
        versionProps.load(new FileInputStream(versionPropsFile))
        def versionCode = versionProps['VERSION_CODE'].toInteger()
        versionProps['VERSION_CODE'] = (versionCode.toInteger() + 1).toString()
        versionProps.store(versionPropsFile.newWriter(), null)
        return versionCode
    }
}

android {
    namespace = "com.android.launcher3"
    compileSdkVersion 36

    defaultConfig {
        minSdkVersion 35 // system default is 36; lowered for sideload testing on Android 15
        targetSdkVersion 36
        versionCode getVersionCode()
        versionName appVersion

        buildConfigField "boolean", "IS_STUDIO_BUILD", "false"
        buildConfigField "boolean", "QSB_ON_FIRST_SCREEN", "false"
        buildConfigField "boolean", "WIDGET_ON_FIRST_SCREEN", "false"
        buildConfigField "boolean", "WIDGETS_ENABLED", "true"
        buildConfigField "boolean", "NOTIFICATION_DOTS_ENABLED", "true"
    }

    signingConfigs {
        platformConfig {
            storeFile file("$rootDir/keystore/platform.jks")
            storePassword 'platform'
            keyAlias 'platform'
            keyPassword 'platform'
        }
    }

    android.applicationVariants.configureEach { variant ->
        def nameCap = variant.name.capitalize()
        def filteredResDir = "$rootDir/build/filteredRes/${nameCap}"

        def resDirs = variant.sourceSets
                .collectMany { it.res.srcDirs }
                .findAll { it.exists() }
                .collect { it.absolutePath }

        tasks.register("filterResFor${nameCap}", Exec) {
            doFirst { delete(filteredResDir) }
            commandLine(["python3", "filter_androidprv.py", filteredResDir] + resDirs)
        }

        tasks.named("merge${nameCap}Resources").configure {
            dependsOn("filterResFor${nameCap}")
        }
    }

    buildFeatures {
        buildConfig = true
    }

    buildTypes {
        debug {
            applicationIdSuffix ".test"
            minifyEnabled = false
            signingConfig = signingConfigs.platformConfig
            buildConfigField "boolean", "IS_DEBUG_DEVICE", "true"
        }

        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard.flags", "proguard-rules.pro")
            signingConfig = signingConfigs.platformConfig
            buildConfigField "boolean", "IS_DEBUG_DEVICE", "false"
        }
    }

    flavorDimensions "app", "recents"

    productFlavors {
        bliss {
            dimension "app"
            applicationId 'foundation.e.blisslauncher'
            isDefault = true
        }

        withQuickstep {
            dimension "recents"
        }
    }

    // Migration04 §08 — JVM unit-test source-set. Tests live under
    // bliss/src/test/java and bliss/src/test/resources so they ship with the
    // bliss source-set semantically even though AGP only honours the global
    // `test` source-set name. Run via:
    //   ./gradlew testBlissWithQuickstepDebugUnitTest
    testOptions {
        unitTests {
            includeAndroidResources = true
            // Robolectric needs to read the merged manifest; allow it.
            returnDefaultValues = true
        }
    }

    sourceSets {
        bliss {
            // 'bliss/src' is scanned recursively. The test source-set lives at
            // 'bliss/test/java' (Migration04 §08), NOT 'bliss/src/test/java',
            // precisely so it's outside this srcDir tree and can't bleed into
            // the production compilation.
            //
            // Migration04 §01 — compat/quickstep/** depends on
            // com.android.systemui.shared.* which is only on the classpath in
            // the withQuickstep flavour. Exclude it from the flavour-agnostic
            // bliss source-set; it's added back in via the withQuickstep
            // source-set below.
            java.srcDirs = ['bliss/src']
            java.exclude '**/foundation/e/bliss/compat/quickstep/**'
            manifest.srcFile "bliss/AndroidManifest.xml"
            res.srcDirs = ['bliss/res']
        }

        test {
            java.srcDirs = ['bliss/test/java']
            resources.srcDirs = ['bliss/test/resources']
            // Audit01 #02 close — expose Room's exported schemas to the JVM unit-test
            // classpath so MigrationTestHelper can find e.g.
            // foundation.e.bliss.folders.db.DrawerFolderDatabase/1.json under
            // assets/. The schemas are generated by the KSP arg
            // `room.schemaLocation = $projectDir/bliss/schemas` (see ksp{} block
            // below). Without this assets entry the test fails with
            // FileNotFoundException: Cannot find the schema file in the assets folder.
            assets.srcDirs += ['bliss/schemas']
        }

        blissWithQuickstep {
            manifest.srcFile "quickstep/AndroidManifest-launcher.xml"
        }

        main {
            java.srcDirs = [
                    'libs_systemui/tracinglib/core/src',
                    'shared/src',
                    'src',
                    'tests/multivalentTests/shared'
            ]
            manifest.srcFile 'AndroidManifest-common.xml'
            proto.srcDirs = ['protos/']
            res.srcDirs = [
                    'libs_systemui/animationlib/res',
                    'libs_systemui/iconloaderlib/res',
                    'res',
                    'studio/res'
            ]
        }

        withQuickstep {
            java.srcDirs = [
                    // Migration04 §01 — Bliss compat shims gated to the quickstep
                    // flavour. Lives under bliss/ for module ownership but
                    // compiles only when the withQuickstep flavour is selected,
                    // because ActivityTaskManagerCompat / QuickStepContractCompat
                    // depend on com.android.systemui.shared.* which is only
                    // available in this flavour. See
                    // Plans/Migration04/01-compat-platform.md §2.
                    'bliss/src/foundation/e/bliss/compat/quickstep',
                    'libs_systemui/viewcapturelib/src',
                    'quickstep/dagger',
                    'quickstep/recents_ui_overrides/src',
                    'quickstep/src',
                    'quickstep/src_protolog'
            ]
            manifest.srcFile "quickstep/AndroidManifest.xml"
            proto.srcDirs = [
                    'libs_systemui/viewcapturelib/src/com/android/app/viewcapture/proto',
                    'quickstep/protos_overrides/'
            ]
            res.srcDirs = [
                    'quickstep/recents_ui_overrides/res',
                    'quickstep/res'
            ]
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    kotlinOptions {
        jvmTarget = "21"
        freeCompilerArgs += ["-Xjvm-default=all"]
    }

    lint {
        abortOnError = true
        checkReleaseBuilds = false
        // Migration05 follow-up F1 — UElementAsPsiDetector crashes inside the
        // AGP/Lint Kotlin UAST resolver when analysing
        // libs_systemui/tracinglib/core/src/coroutines/CoroutineTracing.kt
        // ("Exception during resolving KtLambdaExpression" at
        // KaFirExpressionTypeProvider.getExpressionType). This is a bug in
        // Lint itself, not in our source. Disabling the detector lets lint
        // complete without losing other checks; revisit on the next AGP bump.
        disable += "UElementAsPsi"
        // Migration05 follow-up F1.5 — once the UAST detector stopped
        // crashing, lint surfaced ~2102 latent errors that pre-date M04.
        // Baselining them lets the gate pass; triaging is a Migration06
        // candidate. Regenerate explicitly via:
        //   ./gradlew updateLintBaselineBlissWithQuickstepDebug
        // Do NOT auto-update the baseline on every run — that hides
        // regressions. See Plans/Migration05/01-lint-and-logger.md §F1.5.
        baseline = file("lint-baseline.xml")
    }

    lintOptions {
        disable "LogNotTimber"
    }

    addFrameworkJar('framework.jar')

    preBuild.dependsOn 'makeReleaseJar'
    preBuild.dependsOn 'createPreCommitHook'
}

ksp {
    arg("room.schemaLocation", "$projectDir/bliss/schemas".toString())
    arg("room.incremental", "true")
}

tasks.register("makeReleaseJar", Jar) {
    archiveFileName.set("Launcher3QuickStepLib.jar")
    destinationDirectory.set(file("libs"))

    def outputFile = file("libs/Launcher3QuickStepLib.jar")
    onlyIf {
        if (outputFile.exists()) {
            println("Launcher3QuickStepLib.jar already exists. Skipping task.")
            return false  // Skip task execution
        }
        return true
    }

    from(zipTree("libs/classes.jar")) {
        include(
                "com/android/**",
                "lineageos/providers/**",
        )
        exclude(
                "com/android/launcher3/**",
                "com/android/app/**",
                "com/android/quickstep/**",
                "com/android/settingslib/**",
                "com/android/keyguard/**",
                "com/android/internal/**",
                "com/android/systemui/contextualeducation/**",
        )
    }
}

